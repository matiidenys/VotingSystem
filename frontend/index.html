<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting DApp - Головна</title>
    <link rel="stylesheet" href="style.css">
    <script src="ethers.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="container">
            <div class="header-left-group">
                <a href="index.html" class="app-logo">
                    <span style="font-size: 1.5rem;">🗳️</span> Voting DApp
                </a>
            </div>

            <div style="display: flex; align-items: center;">
                <span id="walletInfo" style="font-weight: 600; color: #6B7280; font-size: 0.9rem; margin-right: 12px;">Not connected</span>
                <button id="connectBtn" class="btn-connect">Підключити</button>
            </div>
        </div>
    </header>

    <main class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h1 style="font-size: 1.75rem; margin: 0;">Активні голосування</h1>
            <a href="create.html" style="text-decoration: none;">
                <button class="btn-primary" style="font-size: 1rem; padding: 12px 24px;">
                    + Створити нове
                </button>
            </a>
        </div>

        <div id="pollsList">
            <div style="text-align: center; padding: 40px; color: var(--text-muted);">
                <div class="loader" style="margin: 0 auto 10px auto;"></div>
                <p>Завантаження списку...</p>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
